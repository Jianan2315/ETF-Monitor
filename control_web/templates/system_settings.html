<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统设置</title><link rel="stylesheet" href="/control-static/control.css"></head><body><main class="shell">
<header class="hero compact"><div><p class="eyebrow">GLOBAL SETTINGS</p><h1>系统设置</h1><p>这些设置对所有资产生效，不绑定某一只基金。</p></div><a class="secondary-button" href="/">返回控制台</a></header>
<form id="system-form">
<section class="card"><h2>本地模型</h2><div class="form-grid"><label class="checkbox-row"><input name="llm_enabled" type="checkbox">启用本地模型</label><label>主模型<input name="llm_model"></label><label>模型超时（秒）<input name="llm_timeout_seconds" type="number"></label><label>最大摘要长度<input name="llm_max_summary_chars" type="number"></label><label>上下文长度<input name="llm_num_ctx" type="number"></label><label>最大生成 Token<input name="llm_num_predict" type="number"></label><label>keep_alive<input name="llm_keep_alive"></label></div></section>
<section class="card"><h2>邮件通知</h2><div class="form-grid"><label class="checkbox-row"><input name="email_enabled" type="checkbox">启用邮件</label><label>收件人<input name="email_recipient" type="email"></label><label class="checkbox-row"><input name="email_include_llm_summary" type="checkbox">包含模型摘要</label><label class="checkbox-row"><input name="email_include_raw_metrics" type="checkbox">包含原始指标</label><label class="checkbox-row"><input name="email_force_send" type="checkbox">强制发送（调试）</label><label>DATA_ERROR 去重分钟<input name="email_data_error_dedup_minutes" type="number"></label></div><h3>触发状态</h3><div class="checkbox-grid"><label><input name="trigger_WAIT" type="checkbox">WAIT</label><label><input name="trigger_WATCH" type="checkbox">WATCH</label><label><input name="trigger_HOLD" type="checkbox">HOLD</label><label><input name="trigger_REVIEW_BUY" type="checkbox">REVIEW_BUY</label><label><input name="trigger_PARTIAL_SELL" type="checkbox">PARTIAL_SELL</label></div></section>
<section class="card"><h2>数据、报告和默认时点</h2><div class="form-grid"><label>历史交易日数量<input name="history_days" type="number"></label><label>数据重试次数<input name="retry_max_attempts" type="number"></label><label>报告保留天数<input name="retention_days" type="number"></label><label>历史报告最大数量<input name="max_history_files" type="number"></label><label>默认盘中时点（逗号分隔）<input name="intraday_slots"></label><label>默认收盘时点<input name="close_slot"></label></div></section>
<section class="card save-card"><div class="button-row"><button type="button" id="save-system">保存系统设置</button></div><div id="result" class="result-box" hidden></div></section>
</form></main><script src="/control-static/system_settings.js"></script></body></html>
