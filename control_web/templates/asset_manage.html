<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资产</title><link rel="stylesheet" href="/control-static/control.css"></head><body><main class="shell">
<header class="hero compact"><div><p class="eyebrow">ASSET WORKSPACE</p><h1 id="page-title">资产</h1><p>资产信息、交易、策略、报告、历史与计划均属于当前资产。</p></div><div class="button-row"><a class="secondary-button" href="/">返回组合</a><a id="asset-report-link" class="secondary-button" href="#">报告</a><a id="asset-history-link" class="secondary-button" href="#">历史</a><a id="asset-schedule-link" class="secondary-button" href="#">计划</a></div></header>
<section class="card"><div class="section-title-row"><div><h2>当前资产</h2><p>切换资产会立即重新加载该资产的数据。</p></div><button id="delete-asset" class="danger-button">删除资产</button></div><div class="form-grid"><label>选择资产<select id="asset-selector"></select></label></div></section>
<form id="asset-form"><section class="card"><h2>资产信息</h2><div class="form-grid"><label>资产名称<input name="asset_name" required></label><label>持有代码<input name="asset_code" required></label><label>跟踪名称<input name="tracking_name" required></label><label>跟踪代码<input name="tracking_code" required></label><label class="checkbox-row"><input name="asset_enabled" type="checkbox">启用资产</label></div><div class="button-row"><button type="button" id="save-asset">保存资产信息</button></div></section>
<section class="card"><h2>投资策略</h2><p class="muted">这些设置不会成为资产身份信息。</p><div class="form-grid"><label>计划资金<input name="planned_capital" type="number" step="0.01"></label><label>当前资金<input name="current_capital" type="number" step="0.01"></label><label>默认首次买入金额<input name="normal_add_amount" type="number" step="0.01"></label><label>默认加仓金额<input name="enhanced_add_amount" type="number" step="0.01"></label><label>回撤触发阈值（%）<input name="drop_from_last_buy_trigger_pct" type="number" step="0.1"></label><label>复盘频率（天）<input name="stable_days_required" type="number"></label><label>第一止盈阈值（%）<input name="first_take_profit_pct" type="number" step="0.1"></label><label>第二止盈阈值（%）<input name="second_take_profit_pct" type="number" step="0.1"></label></div><div class="button-row"><button type="button" id="save-strategy" class="secondary-button">保存策略</button></div><div id="asset-result" class="result-box" hidden></div></section></form>
<section class="card"><h2>交易记录</h2><div class="form-grid"><label>类型<select id="tx-type"><option value="BUY">买入</option><option value="SELL">卖出</option></select></label><label>日期<input id="tx-date" type="date"></label><label>价格处理<select id="tx-pricing-mode"><option value="CLOSE_ESTIMATE">按交易日收盘价估算</option><option value="PENDING">等待数据</option></select></label><label>交易金额<input id="tx-amount" type="number" step="0.01" min="0"></label><label class="wide">备注<input id="tx-note"></label></div><div class="button-row"><button id="save-transaction">保存交易</button><button id="refresh-transactions" class="secondary-button">刷新</button></div><div id="tx-result" class="result-box" hidden></div><div id="transaction-list" class="transaction-list"></div></section>
</main><script src="/control-static/asset_manage.js"></script></body></html>
