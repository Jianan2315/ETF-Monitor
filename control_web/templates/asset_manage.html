<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资产管理</title><link rel="stylesheet" href="/control-static/control.css"></head><body><main class="shell">
<header class="hero compact"><div><p class="eyebrow">ASSET WORKSPACE</p><h1 id="page-title">资产管理</h1><p>资产信息、交易记录和仓位策略仅作用于当前资产。</p></div><div class="button-row"><a class="secondary-button" href="/">返回控制台</a><a class="secondary-button" href="/asset/new">＋ 新增资产</a></div></header>
<section class="card"><div class="section-title-row"><div><h2>当前资产</h2><p>可在这里切换资产；本页面不会创建新资产。</p></div><button id="delete-asset" class="secondary-button">删除当前资产</button></div><div class="form-grid"><label>选择资产<select id="asset-selector"></select></label></div></section>
<form id="asset-form">
<section class="card"><h2>资产信息</h2><div class="form-grid"><label>资产名称<input name="asset_name"></label><label>持有基金代码<input name="asset_code"></label><label>资产类型<select name="asset_type"><option value="ETF">ETF</option><option value="ETF_LINK">ETF联接基金</option><option value="INDEX_FUND">场外指数基金</option><option value="INDEX">指数</option></select></label><label>盘中跟踪对象类型<select name="tracking_type"><option value="ETF">ETF</option><option value="INDEX">指数</option></select></label><label>盘中跟踪代码<input name="tracking_code"></label><label>盘中跟踪名称<input name="tracking_name"></label><label class="checkbox-row"><input name="asset_enabled" type="checkbox">启用该资产</label></div></section>
<section class="card"><h2>仓位与策略</h2><div class="form-grid"><label>目标仓位<input name="target_amount" type="number" step="0.01"></label><label>回撤触发阈值（%）<input name="drop_from_last_buy_trigger_pct" type="number" step="0.1"></label><label>横盘确认天数<input name="stable_days_required" type="number"></label><label>横盘波动范围（%）<input name="stable_range_pct" type="number" step="0.1"></label><label>连续下跌警告天数<input name="consecutive_down_warning_days" type="number"></label><label>普通加仓额度<input name="normal_add_amount" type="number" step="0.01"></label><label>增强加仓额度<input name="enhanced_add_amount" type="number" step="0.01"></label><label>反转确认天数<input name="reversal_confirmation_days" type="number"></label><label>最小反弹幅度（%）<input name="minimum_rebound_pct" type="number" step="0.1"></label><label>第一止盈阈值（%）<input name="first_take_profit_pct" type="number" step="0.1"></label><label>第一卖出比例（%）<input name="first_sell_position_pct" type="number" step="0.1"></label><label>第二止盈阈值（%）<input name="second_take_profit_pct" type="number" step="0.1"></label><label>第二卖出比例（%）<input name="second_sell_position_pct" type="number" step="0.1"></label><label>最小核心仓位比例（%）<input name="minimum_core_position_pct" type="number" step="0.1"></label></div><div class="button-row"><button type="button" id="save-asset">保存资产与策略</button></div><div id="asset-result" class="result-box" hidden></div></section>
</form>
<section class="card"><h2>新增交易记录</h2><div class="form-grid"><label>类型<select id="tx-type"><option value="BUY">买入</option><option value="SELL">卖出</option></select></label><label>日期<input id="tx-date" type="date"></label><label>价格处理方式<select id="tx-pricing-mode"><option value="CLOSE_ESTIMATE">按交易日收盘价自动计算</option><option value="PENDING">暂不计入仓位</option></select></label><label>交易金额（元）<input id="tx-amount" type="number" step="0.01" min="0"></label><label class="wide">备注<input id="tx-note"></label></div><div class="button-row"><button id="save-transaction">保存交易记录</button><button id="refresh-transactions" class="secondary-button">刷新记录</button></div><div id="tx-result" class="result-box" hidden></div><hr class="section-divider"><h3>现有交易记录</h3><div id="transaction-list" class="transaction-list"></div></section>
</main><script src="/control-static/asset_manage.js"></script></body></html>
