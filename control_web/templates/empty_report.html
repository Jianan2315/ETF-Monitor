<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暂无报告</title><link rel="stylesheet" href="/control-static/control.css"></head><body><main class="shell"><header class="hero compact"><div><p class="eyebrow">ASSET REPORT</p><h1>{{ asset.name if asset else '暂无报告' }}</h1><p>{{ message }}</p></div><a class="secondary-button" href="/">返回组合</a></header><section class="card empty-state"><h2>暂无报告</h2><p>报告只属于当前资产，绝不会显示其他资产的报告。</p>{% if asset %}<a class="button-link" href="/asset/manage?asset_id={{ asset.id }}">生成第一份报告</a>{% else %}<a class="button-link" href="/asset/new">添加资产</a>{% endif %}</section></main></body></html>
