<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Monitor</title><link rel="stylesheet" href="/control-static/control.css"></head>
<body><main class="shell">
<header class="hero"><div><p class="eyebrow">PORTFOLIO MONITOR V13.2</p><h1>Portfolio Monitor</h1><p>多资产投资组合的日常查看与运行入口。</p></div><div class="button-row"><a class="secondary-button" href="/system-tools">系统工具</a><a class="secondary-button" href="/system-settings">系统设置</a></div></header>
<section class="card homepage-card"><div class="section-title-row"><div><h2>我的资产</h2><p>选择资产后，所有资产相关链接都会保持在同一资产范围内。</p></div><div class="button-row"><a class="button-link" href="/asset/new">添加资产</a><a id="edit-asset-link" class="button-link secondary disabled" href="#" aria-disabled="true">编辑当前资产</a></div></div><div class="form-grid"><label>当前资产<select id="asset-selector"><option value="">请选择资产</option></select></label></div><div id="asset-summary" class="status-grid"></div><div class="button-row"><a id="latest-report-link" class="button-link secondary disabled" href="#" aria-disabled="true">查看报告</a></div><div id="asset-empty-note" class="result-box" hidden></div></section>
<section class="card homepage-card"><div class="section-title-row"><div><h2>运行状态</h2><p>简要显示市场、自动监控、防休眠与最近一次运行；详细诊断请使用系统工具。</p></div><button id="refresh-status" class="secondary-button">刷新状态</button></div><div id="running-status" class="status-grid"></div><div class="button-row"><button id="generate-report" data-run-mode="auto">生成当前资产报告</button><a id="schedule-link" class="button-link secondary disabled" href="#" aria-disabled="true">资产计划</a></div><div id="run-result" class="result-box" hidden></div></section>
<section class="card homepage-card"><div><h2>系统工具</h2><p class="muted">使用页面顶部的“系统工具”入口进行环境检查、浏览器检查、数据源诊断和维护操作。</p></div></section>
</main><script src="/control-static/control.js"></script></body></html>
